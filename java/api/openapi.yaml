      description: |-
        Creates a new classification record in the Tactix platform.
        Classifications are used to categorize teams by league, division, or competition level (e.g., “Division 1A”, “Junior Varsity”).
      operationId: createClassification
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              name: Test Classification
              description: This is Test Classification description
            schema:
              $ref: "#/components/schemas/CreateClassificationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              examples:
                Create a new classification:
                  summary: Create a new classification
                  value:
                    message: Classification created successfully
