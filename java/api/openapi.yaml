  /api/v1/client/classifications/{id}:
    delete:
      description: |-
        Deletes a specific classification from the Tactix system using its unique id.
        This permanently removes the classification and disassociates it from any linked team records.
      operationId: deleteClassification
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              examples:
                Delete a classification:
                  summary: Delete a classification
                  value:
                    message: Classification deleted successfully
              schema:
                $ref: "#/components/schemas/DeleteClassificationResponse"
          description: OK
      security:
      - AppId: []
        AppToken: []
      summary: Delete a classification
      tags:
      - classifications
      x-accepts:
      - application/json
    patch:
      description: |-
        Updates an existing classification identified by its unique id.
        This endpoint allows modification of the classification’s name or description.
      operationId: updateClassification
