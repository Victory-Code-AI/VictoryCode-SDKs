openapi: 3.0.0
info:
  contact: {}
  description: "Client APIs for Tactix partners: authenticate, upload game video,\
    \ and retrieve games, plays, game recaps and team metadata."
  title: Victory Code Client API
  version: "1.0"
servers:
- description: Sandbox
  url: https://sandbox.api.tactixai.com
- description: Production
  url: https://api.tactixai.com
tags:
- name: Authentication
  x-displayName: Authentication
- name: Uploads
  x-displayName: Uploads
- name: Games
  x-displayName: Games
- name: Plays & Events
  x-displayName: Plays Events
- name: Game Recap
  x-displayName: Game Recap
- name: Teams
  x-displayName: Teams
- name: Mascot
  x-displayName: Mascots
- name: Classification
  x-displayName: Classifications
- name: Venue
  x-displayName: Venues
paths:
  /api/v1/client/auth/token:
    get:
      description: Exchanges client credentials for a temporary bearer token.
      operationId: getAccessToken
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Authentication successful.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: Authentication failed due to invalid appId or appSecret.
      security:
      - Client-App-Id: []
        AppSecret: []
      summary: Get Access Token
      tags:
      - Authentication
      x-accepts:
      - application/json
  /api/v1/client/classifications:
    get:
      description: Retrieves a paginated list of all team classifications available
        in the system.
      operationId: getClassifications
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          minimum: 1
          type: number
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: number
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListClassificationPaginatedResponseDto"
          description: List of classifications retrieved successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: ""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: ""
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Get all classifications
      tags:
      - Classification
      x-accepts:
      - application/json
    post:
      description: Creates a new classification entry for categorizing teams.
      operationId: createClassification
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassificationDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleClassificationResponseDto"
          description: Classification created successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: ""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: ""
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictErrorResponseDto"
          description: ""
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Create a new classification
      tags:
      - Classification
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/client/classifications/{id}:
    delete:
      description: Permanently deletes a team classification from the system.
      operationId: deleteClassification
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponseDto"
          description: Classification deleted successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: ""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponseDto"
          description: ""
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Delete a classification
      tags:
      - Classification
      x-accepts:
      - application/json
    patch:
      description: Updates an existing team classification entry identified by its
        ID.
      operationId: updateClassification
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassificationDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleClassificationResponseDto"
          description: Classification updated successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: ""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponseDto"
          description: ""
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictErrorResponseDto"
          description: ""
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Update a classification
      tags:
      - Classification
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/client/complete-upload:
    post:
      operationId: completeMultipartUpload
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteMultipartUploadDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteMultipartUploadResponseDto"
          description: Presigned URL for part generated successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: Validation error
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Complete a multipart upload to S3
      tags:
      - Uploads
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/client/game-recap/{videoId}/game-box-score:
    get:
      description: Retrieves full game box score stats for both teams and players
        for a specific game.
      operationId: getGameRecapGameBoxScore
      parameters:
      - explode: false
        in: path
        name: videoId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameBoxScoreResponseDto"
          description: Successful retrieval of the Game Recap Game Box Score
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponseDto"
          description: Not Found
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Get the Game Recap Game Box Score for a specific Game.
      tags:
      - Game Recap
      x-accepts:
      - application/json
  /api/v1/client/game-recap/{videoId}/score:
    get:
      description: Retrieves the final score and the score breakdown by quarter and
        overtime periods for both the home and away teams.
      operationId: getGameRecapScore
      parameters:
      - explode: false
        in: path
        name: videoId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameScoreResponse"
          description: Successful retrieval of the Game Recap Score.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponseDto"
          description: Not Found
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Get the Game Recap Score for a specific Game.
      tags:
      - Game Recap
      x-accepts:
      - application/json
  /api/v1/client/game-recap/{videoId}/scoring-summary:
    get:
      description: "Retrieves a chronological list of all scoring plays for a specific\
        \ game, including details about the play, the drive, and the resulting score."
      operationId: getGameRecapScoringSummary
      parameters:
      - explode: false
        in: path
        name: videoId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameRecapScoringSummaryResponse"
          description: Successful retrieval of the Game Recap Scoring Summary
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponseDto"
          description: Not Found
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Get the Game Recap Scoring Summary for a specific Game.
      tags:
      - Game Recap
      x-accepts:
      - application/json
  /api/v1/client/game-recap/{videoId}/scoring-summary-pro:
    get:
      description: Retrieves the full pro scoring summary for a specific game with
        drive context and players involved for each scoring play.
      operationId: getGameRecapScoringSummaryPro
      parameters:
      - explode: false
        in: path
        name: videoId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameRecapScoringSummaryProResponse"
          description: Successful retrieval of the Game Recap Scoring Summary Pro
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponseDto"
          description: Not Found
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Get the Game Recap Scoring Summary Pro for a specific Game.
      tags:
      - Game Recap
      x-accepts:
      - application/json
  /api/v1/client/game-recap/{videoId}/team-stats:
    get:
      description: "Retrieves a detailed statistical breakdown for both the home and\
        \ away teams, covering offense, defense, and special teams performance."
      operationId: getGameRecapTeamStats
      parameters:
      - explode: false
        in: path
        name: videoId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameRecapTeamStatsResponse"
          description: a detailed statistical breakdown for both teams
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponseDto"
          description: Not Found
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Get the Game Recap Team Stats for a specific Game.
      tags:
      - Game Recap
      x-accepts:
      - application/json
  /api/v1/client/game/{gameId}/plays:
    get:
      description: Retrieves a paginated list of all plays for a given game. The results
        can be filtered by various play attributes.
      operationId: getPlaysOfGame
      parameters:
      - explode: false
        in: path
        name: gameId
        required: true
        schema:
          type: string
        style: simple
      - description: The number of results to return per page.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          type: number
        style: form
      - description: The number of results to skip for pagination.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: number
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Filter by down number
        explode: true
        in: query
        name: down
        required: false
        schema:
          enum:
          - "1"
          - "2"
          - "3"
          - "4"
          example: "1"
          type: string
        style: form
      - description: Filter by distance zone (yards to go)
        explode: true
        in: query
        name: distanceZone
        required: false
        schema:
          enum:
          - SHORT
          - MEDIUM
          - LONG
          - X_LONG
          example: LONG
          type: string
        style: form
      - description: Filter by analyzed play type
        explode: true
        in: query
        name: playType
        required: false
        schema:
          enum:
          - RUN
          - PASS
          - FIELD_GOAL
          - KICKOFF
          - PUNT
          - EXTRA_POINT
          - TWO_POINT_CONVERSION
          - NO_PLAY
          - UNIDENTIFIABLE
          example: PASS
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGameAllPlaysResponseDto"
          description: A paginated list of plays.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponseDto"
          description: Not Found
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Get a list of all plays for a game
      tags:
      - Plays & Events
      x-accepts:
      - application/json
  /api/v1/client/games:
    get:
      description: "Retrieves a paginated list of games, with optional filters for\
        \ team, upload status, and date-time range."
      operationId: getGames
      parameters:
      - description: The number of results to return per page.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          type: number
        style: form
      - description: The number of results to skip for pagination.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: number
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGamesPaginatedResponseDto"
          description: Successful retrieval of the paginated list of games
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: Unauthorized
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: List and Filter Games.
      tags:
      - Games
      x-accepts:
      - application/json
    post:
      description: "Registers a new game and associates a video URL (e.g., from a\
        \ third-party source) with it in a single step."
      operationId: createGameWithVideoUrl
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreateGameWithVideoUrlDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDetailsResponse"
          description: Game created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: ""
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictErrorResponseDto"
          description: Name already exists
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Create a new Game with Video URL
      tags:
      - Games
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/client/games/{gameId}:
    get:
      description: "Retrieves the core metadata for a single game, including date,\
        \ time, location, and teams who participated."
      operationId: getGameDetails
      parameters:
      - explode: false
        in: path
        name: gameId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDetailsResponse"
          description: Successful retrieval of the core game details
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponseDto"
          description: Game not found
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Get a Single Game.
      tags:
      - Games
      x-accepts:
      - application/json
  /api/v1/client/games/{gameId}/video:
    post:
      description: Adds a new video to game.
      operationId: addVideoToGame
      parameters:
      - explode: false
        in: path
        name: gameId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddVideoToGameWithS3LinkDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleVideoResponseDto"
          description: Video added successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: Validation error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponseDto"
          description: Not found
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Add new video to a game
      tags:
      - Games
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/client/games/{gameId}/videos:
    get:
      description: Retrieves a list of videos of a game.
      operationId: getVideosOfGame
      parameters:
      - explode: false
        in: path
        name: gameId
        required: true
        schema:
          type: string
        style: simple
      - description: The number of results to return per page.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          type: number
        style: form
      - description: The number of results to skip for pagination.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: number
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVideoPaginatedResponseDto"
          description: Successful retrieval of the list of videos of a game
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponseDto"
          description: Not Found
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Get a list of videos of a game
      tags:
      - Games
      x-accepts:
      - application/json
  /api/v1/client/initiate-upload:
    post:
      operationId: initiateUpload
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiateMultipartUploadDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiateMultipartUploadResponseDto"
          description: "Multipart upload initiated successfully, returns uploadId."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: Validation error
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Initiate a multipart upload to S3 for a large file
      tags:
      - Uploads
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/client/mascots:
    get:
      description: Retrieves a paginated list of all mascots. Supports searching by
        name and pagination through query parameters.
      operationId: getMascots
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          minimum: 1
          type: number
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: number
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMascotPaginatedResponseDto"
          description: List of mascots retrieved successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponseDto"
          description: ""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponseDto"
          description: ""
      security:
      - Client-App-Token: []
        Client-App-Id: []
      summary: Get all mascots
      tags:
      - Mascot
      x-accepts:
      - application/json
    post:
      description: Creates a new mascot record with a name and description. An optional
        mascot image can be uploaded as part of the multipart form data.
      operationId: createMascot
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMascotDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleMascotResponseDto"
          description: Mascot created successfully.
        "400":
          content:
            application/json:
