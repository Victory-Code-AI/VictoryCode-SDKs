openapi: 3.0.3
info:
  description: "This collection provides the core set of APIs for Tactix clients to\
    \ interact with the platform. It covers authentication and token management, as\
    \ well as a wide range of game-related endpoints including uploading full games,\
    \ fetching generated clips, checking clipping status, retrieving game scoring\
    \ summaries, and accessing detailed team statistics. All requests are versioned\
    \ to ensure backward compatibility and smooth upgrades."
  title: Victory Code Client API
  version: 1.0.0
servers:
- description: Sandbox
  url: https://sandbox.api.tactixai.com
- description: Production
  url: https://api.tactixai.com
tags:
- description: "The Auth folder includes authentication-related endpoints that enable\
    \ secure client access to the Tactix API. These endpoints handle login flows,\
    \ credential validation, and issuance of API tokens. All requests in this section\
    \ must be made over HTTPS to ensure confidentiality and integrity."
  name: auth
  x-displayName: Authentication
- description: "The Uploads endpoints allow clients to create new game uploads (video\
    \ files with metadata) and check the status of ongoing uploads. These endpoints\
    \ are essential for initiating the video processing pipeline, which generates\
    \ clips, scoring summaries, and team statistics."
  name: uploads
  x-displayName: Uploads
- description: "Endpoints for discovering and retrieving game data available to the\
    \ client. Use these to list all games, fetch a single game’s metadata, and navigate\
    \ to related resources such as plays within the game. All endpoints require a\
    \ valid App-Token."
  name: games
  x-displayName: Games
- description: "The Game Recap endpoints provide post-game insights and analytics,\
    \ including overall scores, scoring breakdowns, and team-level statistics. These\
    \ endpoints are scoped to a specific gameId and allow clients to retrieve structured\
    \ summaries generated by the Tactix AI platform."
  name: game-recap
  x-displayName: Game Recap
- description: "The Teams folder provides endpoints for managing team-related data\
    \ within the Tactix platform. It includes APIs to list / retrieve, create, update,\
    \ or delete teams, along with their identifiers, mascots, and classifications."
  name: teams
  x-displayName: Teams
- description: |-
    The Mascots folder provides endpoints to manage mascot data within the Tactix platform.
    Mascots represent the visual or symbolic identity of teams and are often used across UI components, branding materials, and analytical summaries.
    This folder allows clients to create, retrieve, update, and delete mascot records that are linked to team profiles.
  name: mascots
  x-displayName: Mascots
- description: |-
    The Classifications folder provides endpoints for managing team classification data within the Tactix platform.
    A classification defines a league, division, or level of competition that a team belongs to (for example, “Varsity Football” or “High School Division A”).
    Clients can use these endpoints to create, update, view, and delete classifications that are later referenced in Team records.
  name: classifications
  x-displayName: Classifications
paths:
  /api/v1/client/auth/token:
    get:
      description: "This endpoint is used to generate a client API token that authenticates\
        \ subsequent requests to the Tactix API. The client must provide a valid app-id\
        \ and app-secret in the request headers. Upon successful validation, the server\
        \ issues a short-lived JWT (JSON Web Token) that should be included in the\
        \ Authorization header (as App-Token) for all protected API calls."
      operationId: generateAccessToken
      parameters: []
      responses:
        "200":
          content:
            application/json:
              examples:
                Get client api token:
                  summary: Get client api token
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NzdmY2E2NmVkOTk1M2RhYjQ4YThkMGEiLCJpYXQiOjE3NTYzOTAzMzgsImV4cCI6MTc1NjM5MzkzOH0.v_rCKGBlWFGu4wkWYaYEI8sAKmhrA-GpKa86rJOhqnw
                    message: Token generated successfully
              schema:
                $ref: "#/components/schemas/GenerateAccessTokenResponse"
          description: OK
      security:
      - AppId: []
        AppSecret: []
      summary: Get client api token
      tags:
      - auth
      x-accepts:
      - application/json
  /api/v1/client/classifications:
    get:
      description: |-
        Retrieves a paginated list of all classifications available to the authenticated client.
        Each classification object includes a name, description, and timestamps for creation and modification.
        This endpoint is typically used to populate dropdowns or filters when creating or updating teams.
      operationId: listClassifications
      parameters:
      - example: 10
        explode: true
