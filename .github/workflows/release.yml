name: Release SDKs

# Publishes every SDK for a version tag (pushed by regenerate.yml, or manually).
# Each registry is enabled with a repository variable so registries can be
# onboarded one at a time; see README "Release setup".
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Release notes: this version's section of CHANGELOG.md.
          awk -v heading="## ${version} " 'index($0, heading) == 1 {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo "- Python: \`pip install victorycode-sdk==${version}\`"
            echo "- JavaScript/TypeScript: \`npm install @victorycode/sdk@${version}\`"
            echo "- Java: \`ai.victorycode:victorycode-sdk:${version}\`"
            echo "- Kotlin/Android: \`ai.victorycode:victorycode-sdk-kotlin:${version}\`"
            echo "- PHP: \`composer require victorycode/sdk:${version}\`"
            echo "- Swift: \`.package(url: \"https://github.com/${GITHUB_REPOSITORY}\", from: \"${version}\")\`"
          } >> notes.md
          gh release create "$TAG" --title "SDKs ${TAG}" --notes-file notes.md --verify-tag

  pypi:
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build python --outdir python/dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - working-directory: javascript
        run: |
          npm install --no-audit --no-fund
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  maven-central:
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Stage Java artifacts
        working-directory: java
        run: mvn --batch-mode -DskipTests -DaltDeploymentRepository=local::file:${{ github.workspace }}/target/staging-deploy deploy
      - name: Stage Kotlin artifacts
        working-directory: android
        run: gradle --no-daemon --init-script ../ci/maven-central.init.gradle publishAllPublicationsToStagingRepository
      - name: Sign and upload to Maven Central
        uses: jreleaser/release-action@v2
        with:
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ github.ref_name }}
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  packagist:
    # Packagist's GitHub integration picks up new tags on its own; this call only
    # makes the update immediate.
    if: vars.PUBLISH_PACKAGIST == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "{\"repository\":{\"url\":\"https://github.com/${GITHUB_REPOSITORY}\"}}"

  # Swift Package Manager resolves releases directly from the git tag and the
  # root Package.swift, so no publish step is needed.
