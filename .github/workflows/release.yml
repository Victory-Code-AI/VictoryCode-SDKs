name: Release SDKs

# Publishes every SDK for a version tag (pushed by regenerate.yml, or manually).
# Each registry is enabled with a repository variable so registries can be
# onboarded one at a time; see README "Release setup".
#
# To publish (or retry publishing) an existing tag with the current workflow,
# run it manually from main with that tag, e.g. v1.0.0.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v1.0.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          version="${TAG#v}"
          # Release notes: this version's section of CHANGELOG.md.
          awk -v heading="## ${version} " 'index($0, heading) == 1 {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo "- Python: \`pip install victorycode-sdk==${version}\`"
            echo "- JavaScript/TypeScript: \`npm install @victorycode/sdk@${version}\`"
            echo "- Java: \`com.tactixai:victorycode-sdk:${version}\`"
            echo "- Kotlin/Android: \`com.tactixai:victorycode-sdk-kotlin:${version}\`"
            echo "- PHP: \`composer require victorycode/sdk:${version}\`"
            echo "- Swift: \`.package(url: \"https://github.com/${GITHUB_REPOSITORY}\", from: \"${version}\")\`"
          } >> notes.md
          gh release create "$TAG" --title "SDKs ${TAG}" --notes-file notes.md --verify-tag

  pypi:
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read # job-level permissions replace the defaults; checkout needs this
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build python --outdir python/dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true # re-running a release only uploads what is missing

  npm:
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # job-level permissions replace the defaults; checkout needs this
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - working-directory: javascript
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # npm never accepts the same version twice; re-running a release skips it.
          if npm view "${name}@${version}" version --prefer-online >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm."
            exit 0
          fi
          npm install --no-audit --no-fund
          # Provenance requires repository.url to match this repository exactly (case included).
          npm pkg set repository.url="git+https://github.com/${GITHUB_REPOSITORY}.git"
          # npm only accepts provenance from public repositories.
          if [ "$PRIVATE_REPO" = "true" ]; then
            npm publish --access public
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRIVATE_REPO: ${{ github.event.repository.private }}

  maven-central:
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Stage Java artifacts
        working-directory: java
        run: mvn --batch-mode -DskipTests -DaltDeploymentRepository=local::file:${{ github.workspace }}/target/staging-deploy deploy
      - name: Stage Kotlin artifacts
        working-directory: android
        run: gradle --no-daemon --init-script ../ci/maven-central.init.gradle publishAllPublicationsToStagingRepository
      - name: Version from tag
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV" # JReleaser wants 1.2.3, not v1.2.3
      - name: Sign and upload to Maven Central
        uses: jreleaser/release-action@v2
        with:
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ env.VERSION }}
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  packagist:
    # Packagist's GitHub integration picks up new tags on its own; this call only
    # makes the update immediate.
    if: vars.PUBLISH_PACKAGIST == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "{\"repository\":{\"url\":\"https://github.com/${GITHUB_REPOSITORY}\"}}"

  # Swift Package Manager resolves releases directly from the git tag and the
  # root Package.swift, so no publish step is needed.
