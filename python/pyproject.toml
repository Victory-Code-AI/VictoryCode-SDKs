[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "victorycode-sdk"
version = "0.1.0"
description = "Official Python SDK for Victory Code APIs"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["victorycode_sdk*"]
